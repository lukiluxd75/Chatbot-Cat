<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Trámites Catastrales</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#113a52', 600: '#0d2d40' },
                        accent: { 500: '#72ae17', 600: '#5c8f12' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-brand-500 text-white px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Gestión de Trámites Catastrales</h1>
            <a href="/" class="text-sm underline hover:text-accent-500">Ir al Chatbot</a>
        </div>
        
        <div class="p-6">
            <p class="text-gray-600 mb-6">Desde este panel puedes editar la información básica de los trámites en la base de datos (PostgreSQL). Los cambios se reflejarán inmediatamente en el asistente.</p>
            
            <div id="alert-container"></div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Clave</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Costo</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="procedures-tbody" class="bg-white divide-y divide-gray-200">
                        <!-- Filas inyectadas por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Editar Trámite -->
    <div id="edit-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
            <div class="px-6 py-4 border-b">
                <h3 class="text-lg font-bold text-gray-900" id="modal-title">Editar Trámite</h3>
            </div>
            <div class="p-6">
                <form id="edit-form">
                    <input type="hidden" id="edit-code">
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Trámite</label>
                        <input type="text" id="edit-name" required class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-brand-500 focus:border-brand-500">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                        <textarea id="edit-description" rows="4" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-brand-500 focus:border-brand-500"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Monto (Ej: 50)</label>
                            <input type="number" step="0.01" id="edit-amount" class="w-full border-gray-300 rounded-md shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Moneda (Ej: Bs.)</label>
                            <input type="text" id="edit-currency" class="w-full border-gray-300 rounded-md shadow-sm border p-2">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="flex items-center">
                            <input type="checkbox" id="edit-active" class="rounded border-gray-300 text-brand-500 shadow-sm w-4 h-4">
                            <span class="ml-2 text-sm text-gray-700">Trámite Activo (Visible)</span>
                        </label>
                    </div>
                    
                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 font-medium">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-brand-500 text-white rounded-md hover:bg-brand-600 font-medium">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let proceduresData = {};

        async function loadProcedures() {
            try {
                const res = await fetch('/api/admin/procedures');
                if (!res.ok) throw new Error("Error cargando los datos");
                const rows = await res.json();
                
                const tbody = document.getElementById('procedures-tbody');
                tbody.innerHTML = '';
                
                rows.forEach(t => {
                    proceduresData[t.code] = t; // Guardar para el modal
                    
                    const tr = document.createElement('tr');
                    
                    const tdCode = document.createElement('td');
                    tdCode.className = "px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-500";
                    tdCode.textContent = t.code;
                    
                    const tdName = document.createElement('td');
                    tdName.className = "px-6 py-4 text-sm font-medium text-gray-900";
                    tdName.textContent = t.name;
                    
                    const tdCost = document.createElement('td');
                    tdCost.className = "px-6 py-4 whitespace-nowrap text-sm text-gray-500";
                    tdCost.textContent = t.amount ? `${t.currency || ''} ${t.amount}` : '-';
                    
                    const tdStatus = document.createElement('td');
                    tdStatus.className = "px-6 py-4 whitespace-nowrap";
                    const spanStatus = document.createElement('span');
                    spanStatus.className = `px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${t.is_active === 1 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
                    spanStatus.textContent = t.is_active === 1 ? 'Activo' : 'Inactivo';
                    tdStatus.appendChild(spanStatus);
                    
                    const tdAction = document.createElement('td');
                    tdAction.className = "px-6 py-4 whitespace-nowrap text-sm font-medium";
                    const btnEdit = document.createElement('button');
                    btnEdit.className = "text-brand-500 hover:text-brand-600 font-bold";
                    btnEdit.textContent = "Editar";
                    btnEdit.onclick = () => openModal(t.code);
                    tdAction.appendChild(btnEdit);
                    
                    tr.append(tdCode, tdName, tdCost, tdStatus, tdAction);
                    tbody.appendChild(tr);
                });
            } catch (err) {
                showAlert("Error de conexión con la base de datos.", "error");
            }
        }

        function openModal(code) {
            const data = proceduresData[code];
            if(!data) return;
            
            document.getElementById('modal-title').textContent = `Editar: ${code}`;
            document.getElementById('edit-code').value = data.code;
            document.getElementById('edit-name').value = data.name || '';
            document.getElementById('edit-description').value = data.description || '';
            document.getElementById('edit-amount').value = data.amount || '';
            document.getElementById('edit-currency').value = data.currency || '';
            document.getElementById('edit-active').checked = (data.is_active === 1);
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('edit-code').value;
            
            const payload = {
                name: document.getElementById('edit-name').value,
                description: document.getElementById('edit-description').value,
                amount: parseFloat(document.getElementById('edit-amount').value) || null,
                currency: document.getElementById('edit-currency').value,
                is_active: document.getElementById('edit-active').checked ? 1 : 0
            };

            try {
                const res = await fetch(`/api/admin/procedures/${code}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(!res.ok) throw new Error("Error al guardar");
                
                closeModal();
                showAlert("¡Trámite actualizado correctamente!", "success");
                loadProcedures(); // Recargar tabla
            } catch(err) {
                showAlert("No se pudo guardar la información.", "error");
            }
        });

        function showAlert(msg, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `p-4 mb-4 text-sm rounded-lg ${type === 'success' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`;
            alert.textContent = msg;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

        // Init
        loadProcedures();
    </script>
</body>
</html>
